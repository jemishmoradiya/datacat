name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  server:
    name: Server and web UI (${{ matrix.storage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [postgres, clickhouse]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: datacat, POSTGRES_PASSWORD: datacat, POSTGRES_DB: datacat }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U datacat" --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.10
        env: { CLICKHOUSE_USER: datacat, CLICKHOUSE_PASSWORD: datacat, CLICKHOUSE_DB: datacat, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["8123:8123"]
    env:
      DATABASE_URL: postgresql://datacat:datacat@localhost:5432/datacat
      DATACAT_STORAGE: ${{ matrix.storage }}
      DATACAT_CLICKHOUSE_URL: http://localhost:8123
      DATACAT_CLICKHOUSE_USER: datacat
      DATACAT_CLICKHOUSE_PASSWORD: datacat
      DATACAT_SETUP_TOKEN: ci-only-setup-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm run format:check
      - name: Typecheck
        run: pnpm exec tsc --build lib/db && pnpm --filter @workspace/api-server run typecheck && pnpm --filter @workspace/web run typecheck
      - name: Unit tests
        run: pnpm --filter @workspace/api-server test
      - name: Dependency audit
        if: matrix.storage == 'postgres'
        run: pnpm audit --prod
      - name: Build
        run: pnpm --filter @workspace/api-server run build && BASE_PATH=/ pnpm --filter @workspace/web run build
      - name: Start DataCat
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8123/ping > /dev/null && break; sleep 1; done
          PORT=3000 NODE_ENV=production PUBLIC_URL=http://localhost:3000 SESSION_SECRET=ci-only-session-secret-0123456789abcdef node artifacts/api-server/dist/index.mjs > server.log 2>&1 &
      - name: End-to-end known-answer checks
        run: bash scripts/e2e.sh
      - name: Server log
        if: failure()
        run: tail -200 server.log

  node-library:
    name: Node.js library
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/node } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev

  python-library:
    name: Python library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e 'sdks/python[test]' pip-audit
      - run: python -m unittest discover -s sdks/python/tests
      - run: pip-audit --skip-editable

  agent:
    name: Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # No committed go.sum (the collector sources are generated), so setup-go's own cache never has a key to use.
        with: { go-version: "1.26.11", cache: false }
      - name: Go module and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('agent/manifest.yaml', 'agent/build.sh') }}
          restore-keys: go-${{ runner.os }}-
      - name: Build and test
        run: bash agent/build.sh
      - name: Vulnerability scan
        working-directory: agent/_build
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker-and-secrets:
    name: Docker build and secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.11" }
      - name: Secrets scan (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 git --redact --verbose .
      - name: Docker image builds
        run: docker build -t datacat:ci .
